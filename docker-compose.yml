      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${DOMAIN_ID}
    command: bash -c "ros2 launch robot_bringup cbf_pc_selector_sim.launch.py cfg:=cbf_pc_selector_sim_unipilot.yaml"
    volumes:
      - ./workspaces/ws_cbf:/workspace
      - *robot-bringup-volume
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri

  ros2_launch_composite_cbf:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_cbf
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${DOMAIN_ID}
    command: bash -c "ros2 launch robot_bringup cbf_sim.launch.py cfg:=cbf_sim_unipilot.yaml robot_name:=rmf_unipilot"
    volumes:
      - ./workspaces/ws_cbf:/workspace
      - *robot-bringup-volume
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri

