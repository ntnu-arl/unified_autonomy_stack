  # # # ==================== RL ====================
  ros2_launch_rl:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_rl
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${DOMAIN_ID}
    command: bash -c "source /opt/ros/humble/setup.bash && cd /workspace/src/rl_nav/scripts && python3 lidar_nav_vel_ros2_node.py --env=lidar_navigation_task --experiment="magpie_lidar_policy7_vel_ttc_yaw_noisy_obs_21_Nov""
    volumes:
      - ./workspaces/ws_rl:/workspace
      - *robot-bringup-volume
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri

  # # # ==================== NMPC ====================

  # # --- NMPC colcon build ---
  ros2_launch_nmpc:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_nmpc
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - PYTHONPATH=/workspace/src/sdf-nmpc:/home/developer/acados/interfaces/acados_template:${PYTHONPATH}
      - ACADOS_SOURCE_DIR=/home/developer/acados
      - LD_LIBRARY_PATH=/usr/local/lib:/home/developer/acados/lib:${LD_LIBRARY_PATH}
      - ROS_DOMAIN_ID=${DOMAIN_ID}
    command: bash -c "source /opt/ros/humble/setup.bash && source install/setup.bash && ros2 launch robot_bringup nmpc_full.launch.py cfg:=nmpc_sim_helicopter.yaml odometry:=/helicopter/odom input_image:=/helicopter/lidar/range output_topic:=/sdf_nmpc/cmd/acc"
    volumes:
      - ./workspaces/ws_nmpc:/workspace
      - *robot-bringup-volume
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri

  # # # ==================== CBF ====================
  ros2_launch_cbf_pc_select:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_cbf
    runtime: nvidia
    environment:
