# ==================== ANCHORS/TEMPLATES ====================
x-system-template: &system-template
  # runtime: nvidia
  working_dir: /workspace
  network_mode: host
  ipc: host
  restart: "no"
  stdin_open: true
  tty: true
  environment:
  - DISPLAY=${DISPLAY:-:0}
  - NVIDIA_VISIBLE_DEVICES=all
  - NVIDIA_DRIVER_CAPABILITIES=all
  - QT_X11_NO_MITSHM=1
  - DISABLE_ROS1_EOL_WARNINGS=1
  - ROS_IP=127.0.0.1
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw

x-x11-volume: &x11-volume
  /tmp/.X11-unix:/tmp/.X11-unix:rw

x-robot-bringup-volume: &robot-bringup-volume
  ./workspaces/robot_bringup:/workspace/src/robot_bringup:rw

x-recorded-data-volume: &recorded-data-volume
  ./data:/data:rw

x-catkin-build-template: &catkin-build-template
  <<: *system-template
  command: catkin build -DCMAKE_BUILD_TYPE=Release
  profiles: ["build"]

x-colcon-build-template: &colcon-build-template
  <<: *system-template
  command: colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release #TODO number of cores, check config file in magpie for colcon defaults
  profiles: ["build"]

x-ros1-wait-for-roscore: &ros1-wait-for-roscore
  depends_on:
    ros1_launch_roscore:
      condition: service_healthy

x-ros1-launch-template: &ros1-launch-template
  <<: [*system-template, *ros1-wait-for-roscore]
  profiles: ["launch"]

x-ros2-launch-template: &ros2-launch-template
  <<: [*system-template]
  profiles: ["launch"]

# ==================== SERVICES ====================

services:
  # # ==================== UTILITIES ====================

  # --- ROScore (needed for centralized roscore) ---
  ros1_launch_roscore:
    <<: [*system-template]
    image: unified_autonomy:ros1_base
    profiles: ["launch"]
    command: roscore
    healthcheck:
      test: ["CMD-SHELL", "bash", "-c", "source /opt/ros/noetic/setup.bash && rostopic list || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 3s  # Give it time to start before checking
  
  ros1_launch_bridge_params:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    command: bash -c "roslaunch robot_bringup bridge_params.launch config_file:=uav_helicopter"
    volumes:
      - *robot-bringup-volume
      - *recorded-data-volume
      - ./workspaces/ws_ros1_launcher:/workspace # TODO: This is a hack to get a workspace mounted which has the robot bringup package built.

  
  ros2_launch_ros1_bridge:
    <<: [*ros2-launch-template]
    image: unified_autonomy:ros2_ros1_bridge
    # command: ros2 run ros1_bridge dynamic_bridge #TODO: set this as a static bridge which is actually a param bridge file -check new magpie for this/
    command: bash -c "ros2 run ros1_bridge parameter_bridge"
    # command: bash -c "ros2 run ros1_bridge parameter_bridge --bridge-tf-frames "map" "rmf" "rmf/base_link/lidar""
    volumes:
      - ./workspaces/ws_ros1_bridge:/workspace
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}
    depends_on:
      ros1_launch_roscore:
        condition: service_healthy

  # ==================== CODE ====================
  # * Each workspace is built and launched in its own service
  # * Convenience common map merges are provided for the expected standard use cases
  # * eg. <<: [*catkin-build-template] to inherit common build settings, <<: [*ros1-launch-template]
  # * to inherit common ros 1launch settings ...
  # * Naming convention:
  # *   build service: build_<workspace_name>
  # *   ros1_launch service: ros1_launch_<workspace_name>
  # *   ros2_launch service: ros2_launch_<workspace_name>
  # *   workspace folder: ws_<workspace_name>

  # ==================== PLANNING ====================

  # Planner
  # --- GBPlanner ---
  ros1_launch_gbplanner:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_gbplanner
    command: roslaunch robot_bringup gbplanner_heli_sim.launch
    privileged: true
    volumes:
      - *x11-volume
      - *robot-bringup-volume
      - ./workspaces/ws_gbplanner:/workspace
    devices:
      - /dev/dri:/dev/dri
    deploy:  # Add this section
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==================== SIMULATION ====================

  # --- Simulation ---
  ros2_launch_sitl:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_heli_sim
    command: bash -c "python3 ${ARDUPILOT_DIR:-/ardupilot}/Tools/autotest/sim_vehicle.py -v ArduCopter -f heli --no-rebuild --add-param-file /workspace/src/robot_bringup/config/ros2/heli_params/heli_sitl.parm --out udp:localhost:14550 --out udp:localhost:14551 --custom-location=${HOME_LAT:--35.363262},${HOME_LON:-149.165237},${HOME_ALT:-584},${HOME_HEADING:-353} --console"
    volumes:
      - *x11-volume
      - ./workspaces/ws_sim:/workspace
      - *robot-bringup-volume
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0 if s.connect_ex(('localhost',5760))==0 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}

  ros2_launch_mavros:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_heli_sim
    depends_on:
      ros2_launch_sitl:
        condition: service_healthy
    command: bash -c "source /opt/ros/humble/setup.bash && ros2 run mavros mavros_node --ros-args --params-file /workspace/src/robot_bringup/config/ros2/mavros_apm.yaml -r __ns:=/mavros"
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}
    volumes:
      - *x11-volume
      - ./workspaces/ws_sim:/workspace
      - *robot-bringup-volume

  ros2_launch_heli_manager:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_heli_sim
    depends_on:
      ros2_launch_sitl:
        condition: service_healthy
    command: bash -c "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && sleep 10 && ros2 launch helicopter_bridge heli_manager.launch.py use_sim_time:=false takeoff_alt_m:=${TAKEOFF_ALT:-1.0} control_mode:=${CONTROL_MODE:-velocity} cmd_topic:=${CMD_TOPIC:-/sdf_nmpc/cmd/acc}"
    volumes:
      - ./workspaces/ws_sim:/workspace
      - *robot-bringup-volume
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=${DOMAIN_ID}
      - TAKEOFF_ALT=${TAKEOFF_ALT:-3.0}
      - CONTROL_MODE=${CONTROL_MODE:-velocity}
      - CMD_TOPIC=${CMD_TOPIC:-/sdf_nmpc/cmd/acc}

  # ── Gazebo simulation world + lidar sensor ──────────────────────────────────
  # Launches Gazebo Harmonic with the selected rmf_gz world, spawns the
  # helicopter model with a 3-D lidar, bridges lidar→PointCloud2 in ROS 2,
  # and runs GzPoseBridgeNode to keep the Gazebo model aligned to MAVROS odom.
  #
  # Override the world with:  GZ_WORLD=corridor_pillars docker compose ... up
  #
  # The lidar PointCloud2 topic will be: /<GZ_MODEL_NAME>/lidar/points
  #   (default: /helicopter/lidar/points)
  #
  # Requires ws_sim to be built first (build_heli_bridge service).
  ros2_launch_heli_gz:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_heli_sim
    command: bash -c "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && ros2 launch helicopter_bridge gz_heli.launch.py world:=${GZ_WORLD:-pittsburgh_mine} headless:=${GZ_HEADLESS:-true} world_name:=${GZ_WORLD_NAME:-map} model_name:=${GZ_MODEL_NAME:-helicopter}
      "
    volumes:
      - *x11-volume
      - ./workspaces/ws_sim:/workspace
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=${DOMAIN_ID}
      - GZ_WORLD=${GZ_WORLD:-corridor_pillars}
      - GZ_HEADLESS=${GZ_HEADLESS:-true}
      - GZ_WORLD_NAME=${GZ_WORLD_NAME:-map}
      - GZ_MODEL_NAME=${GZ_MODEL_NAME:-helicopter}
      # Make world files (rmf_gz) and the installed helicopter model resolvable
      - GZ_SIM_RESOURCE_PATH=/workspace/src/rmf_gz/resources:/workspace/install/helicopter_bridge/share/helicopter_bridge/resources:/workspace/src/subt_cave_sim:/workspace/src/subt_cave_sim/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Lidar processing ────────────────────────────────────────────────────────
  # pc_to_range: converts /helicopter/lidar/points → /helicopter/lidar/range
  #              (spherical range image consumed by the NMPC VAE)
  # pc_sparsify: downsamples to /helicopter/lidar/points_downsampled
  #              (consumed by GBPlanner and the ros1 bridge)
  # Also publishes the static /map → /helicopter/odom TF for GBPlanner/voxblox.
  #
  # Uses ros2_sim (has rmf_gz) with ws_sim mounted at /workspace — same layout
  # as build_sim — so rmf_gz and robot_bringup are found after make build.
  ros2_launch_lidar_proc:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_sim
    command: bash -c "source /workspace/install/setup.bash && ros2 launch robot_bringup uav_sim_helicopter.launch.xml robot_name:=${GZ_MODEL_NAME:-helicopter}"
    volumes:
      - ./workspaces/ws_sim:/workspace:ro
      - *robot-bringup-volume
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}

  # ── Odometry verification ───────────────────────────────────────────────────
  # One-shot: prints the message rate and a single sample from MAVROS odom.
  # Run with:  docker compose -f docker-compose.heli_sim.yml run --rm ros2_check_odom
  ros2_check_odom:
    <<: *system-template
    image: unified_autonomy:ros2_heli_sim
    profiles: ["check"]
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        echo '--- topic hz (10 messages) ---' &&
        ros2 topic hz /mavros/local_position/odom --window 10 &
        HZ_PID=\$! &&
        sleep 5 && kill \$HZ_PID 2>/dev/null;
        echo '--- single message ---' &&
        ros2 topic echo --once /mavros/local_position/odom
      "
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}




  # ── PID path follower ───────────────────────────────────────────────────────
  # Replaces the NMPC for testing: subscribes to /gbplanner_path and
  # publishes body-frame ENU acceleration on /sdf_nmpc/cmd/acc.
  # Tune gains via environment variables passed as launch arguments.
  ros2_launch_path_follower:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_heli_sim
    command: bash -c "source /opt/ros/humble/setup.bash && source /workspace/install/setup.bash && ros2 launch helicopter_bridge path_follower.launch.py waypoint_radius:=${WP_RADIUS:-1.5} kp_xy:=${KP_XY:-0.8} kp_z:=${KP_Z:-0.8} max_vel_xy:=${MAX_VEL_XY:-2.0} max_vel_z:=${MAX_VEL_Z:-1.0}"
    volumes:
      - ./workspaces/ws_sim:/workspace
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}
      - WP_RADIUS=${WP_RADIUS:-1.5}
      - KP_XY=${KP_XY:-0.8}
      - KP_Z=${KP_Z:-0.8}
      - MAX_VEL_XY=${MAX_VEL_XY:-2.0}
      - MAX_VEL_Z=${MAX_VEL_Z:-1.0}

  # ── Odometry relay ──────────────────────────────────────────────────────────
  # Relays /mavros/local_position/odom → /helicopter/odom.
  # topic_tools relay re-publishes with the subscriber's QoS so downstream
  # nodes (NMPC, CBF) that expect RELIABLE do not see QoS mismatches.
  ros2_relay_odom:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_heli_sim
    command: bash -c "source /opt/ros/humble/setup.bash && python3 /workspace/src/robot_bringup/scripts/ros2/odom_relay.py /mavros/local_position/odom /helicopter/odom helicopter/base_link"
    volumes:
      - *robot-bringup-volume
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}

