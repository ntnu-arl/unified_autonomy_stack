# ==================== ANCHORS/TEMPLATES ====================
x-x11-volume: &x11-volume /tmp/.X11-unix:/tmp/.X11-unix:rw

x-robot-bringup-volume: &robot-bringup-volume ./workspaces/robot_bringup:/workspace/src/robot_bringup:rw

x-recorded-data-volume: &recorded-data-volume ./data:/data:rw

x-system-template: &system-template # runtime: nvidia
  working_dir: /workspace
  network_mode: host
  ipc: host
  restart: "no"
  stdin_open: true
  tty: true
  environment:
    - DISPLAY=${DISPLAY:-:0}
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=all
    - QT_X11_NO_MITSHM=1
    - DISABLE_ROS1_EOL_WARNINGS=1
  volumes:
    - *x11-volume
    - *robot-bringup-volume
    - *recorded-data-volume

x-catkin-build-template: &catkin-build-template
  <<: *system-template
  command: catkin build -DCMAKE_BUILD_TYPE=Release
  profiles: ["build"]

x-colcon-build-template: &colcon-build-template
  <<: *system-template
  command: colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release #TODO number of cores, check config file in magpie for colcon defaults
  profiles: ["build"]

x-ros1-wait-for-roscore: &ros1-wait-for-roscore
  depends_on:
    ros1_launch_roscore:
      condition: service_healthy

x-ros1-launch-template: &ros1-launch-template
  <<: [*system-template, *ros1-wait-for-roscore]
  profiles: ["launch"]

x-ros2-launch-template: &ros2-launch-template
  <<: [*system-template]
  profiles: ["launch"]

# ==================== SERVICES ====================

services:
  # # ==================== UTILITIES ====================

  # --- ROScore (needed for centralized roscore) ---
  ros1_launch_roscore:
    <<: [*system-template]
    image: unified_autonomy:ros1_base
    profiles: ["launch"]
    command: roscore
    healthcheck:
      test: ["CMD-SHELL", "bash", "-c", "source /opt/ros/noetic/setup.bash && rostopic list || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 3s  # Give it time to start before checking
  
  ros1_launch_recorder:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    # runs as the host user (not root, the image default) so bag files under ./data land owned by you,
    # not root - avoids needing sudo to manage/delete recordings afterward. HOME must be set explicitly:
    # UID 1000 has no /etc/passwd entry in this image, so $HOME defaults to "/" (not writable) - roslaunch
    # writes its own run logs to $HOME/.ros/log and would fail to start without this.
    user: "1000:1000"
    environment:
      # note: this list replaces (does not merge with) *system-template's environment block via YAML
      # anchor semantics, so it's repeated here in full plus HOME
      - DISPLAY=${DISPLAY:-:0}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - DISABLE_ROS1_EOL_WARNINGS=1
      - HOME=/tmp
    command: roslaunch robot_bringup bag_rec.launch record:=${RECORD} record_path:=${BAG_PATH}
    volumes:
      - *robot-bringup-volume
      - *recorded-data-volume
      - ./workspaces/ws_vectornav:/workspace # TODO: This is a hack to get a workspace mounted which has the robot bringup package built.
  
  ros1_launch_bridge_params:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    command: bash -c "roslaunch robot_bringup bridge_params.launch config_file:=robot"
    volumes:
      - *robot-bringup-volume
      - *recorded-data-volume
      - ./workspaces/ws_ros1_launcher:/workspace # TODO: This is a hack to get a workspace mounted which has the robot bringup package built.

  
  ros2_launch_ros1_bridge:
    <<: [*ros2-launch-template]
    image: unified_autonomy:ros2_ros1_bridge
    # command: ros2 run ros1_bridge dynamic_bridge #TODO: set this as a static bridge which is actually a param bridge file -check new magpie for this/
    command: bash -c "ros2 run ros1_bridge parameter_bridge"
    # command: bash -c "ros2 run ros1_bridge parameter_bridge --bridge-tf-frames "map" "rmf" "rmf/base_link/lidar""
    volumes:
      - ./workspaces/ws_ros1_bridge:/workspace
      # parameter_bridge was linked against example_interfaces/map_msgs/turtlesim typesupport libs (pulled
      # in from ros-humble-desktop at build time) that ros2_base no longer ships since the desktop-full ->
      # ros-base switch. Extracted from unified_autonomy:ros1-bridge-builder (its build stage still has
      # them) rather than apt-installing, since this network's path to the package mirrors is unreliable.
      - ./workspaces/ws_ros1_bridge_extra_libs:/extra_libs:ro
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}
      - LD_LIBRARY_PATH=/extra_libs:/opt/ros/humble/lib
    depends_on:
      ros1_launch_roscore:
        condition: service_healthy
      ros1_launch_bridge_params:
        condition: service_completed_successfully

  # ==================== CODE ====================
  # * Each workspace is built and launched in its own service
  # * Convenience common map merges are provided for the expected standard use cases
  # * eg. <<: [*catkin-build-template] to inherit common build settings, <<: [*ros1-launch-template]
  # * to inherit common ros 1launch settings ...
  # * Naming convention:
  # *   build service: build_<workspace_name>
  # *   ros1_launch service: ros1_launch_<workspace_name>
  # *   ros2_launch service: ros2_launch_<workspace_name>
  # *   workspace folder: ws_<workspace_name>

  # ==================== DRIVERS ====================

  # IMU
  # --- VectorNav ---
  ros1_launch_vectornav:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    command: roslaunch robot_bringup vectornav_driver.launch
    volumes:
      - *robot-bringup-volume
      - ./workspaces/ws_vectornav:/workspace
    devices:
      - /dev/ttyTHS2:/dev/ttyTHS1
    group_add:
      - dialout
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash",
          "-c",
          "source /opt/ros/noetic/setup.bash && rostopic echo -n 1 /vectornav_driver/imu/data > /dev/null || exit 1",
        ]
      interval: 5s
      timeout: 2s # Docker will fail the check if a message isn't received within 3 seconds
      retries: 5
      start_period: 5s # Gives the sensor time to initialize and start publishing

  # LiDAR
  # --- Hesai LiDAR ---
  ros1_launch_hesailidar:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    command: roslaunch robot_bringup jt128.launch
    volumes:
      - *robot-bringup-volume
      - ./workspaces/ws_hesailidar:/workspace 

  # Radar
  # --- MMWave TI ROS ---
  ros1_launch_mmwave_ti_ros:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    command: roslaunch robot_bringup iwr6843aop.launch
    volumes:
      - *robot-bringup-volume
      - ./workspaces/ws_mmwave_ti_ros:/workspace
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1

  # Low-Level Vehicle Interface
  # --- MAVROS ---
  build_mavros:
    <<: [*catkin-build-template]
    image: uas:ros1_base
    command: bash -c "source /workspace/src/mavros/mavros/scripts/install_geographiclib_datasets.sh"
    volumes:
      - *robot-bringup-volume
      - ./workspaces/ws_mavros:/workspace

  # Estimation / SLAM
  # --- MIMOSA ---
  ros1_launch_mimosa:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    command: roslaunch robot_bringup mimosa.launch
    volumes:
      - *robot-bringup-volume
      - ./workspaces/ws_mimosa:/workspace

  # --- ETHZ ASL MSF ---
  ros1_launch_ethzasl_msf:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    command: roslaunch robot_bringup msf_mimosa.launch
    volumes:
      - *robot-bringup-volume
      - ./workspaces/ws_ethzasl_msf:/workspace

  # ==================== PLANNING ====================

  # Planner
  # --- GBPlanner ---
  ros1_launch_gbplanner:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_gbplanner
    runtime: nvidia
    command: roslaunch robot_bringup gbplanner_robot.launch
    privileged: true
    volumes:
      - *x11-volume
      - *robot-bringup-volume
      - ./workspaces/ws_gbplanner:/workspace
    devices:
      - /dev/dri:/dev/dri

  # --- Lidar range-image generator (feeds NMPC's SDF/collision observation) ---
  # ROS1 port of dome_lidar_processor (matches magpie's proven setup - see ws_control/README notes).
  # Input is mimosa's deskewed point cloud; output is remapped to /img_node/range_image inside the launch
  # file, which is already bridged to ROS2 in bridge_robot.yaml.
  ros1_launch_dome_lidar_processor:
    <<: [*ros1-launch-template]
    image: unified_autonomy:ros1_base
    command: roslaunch dome_lidar_processor dome_lidar_slicer.launch
    volumes:
      - *robot-bringup-volume
      - ./workspaces/ws_control:/workspace

  # # ==================== VLM ====================

  # --- VLM ---
  # ros1_launch_vlm:
  #   <<: [*ros1-launch-template]
  #   image: unified_autonomy:ros1_vlm
  #   runtime: nvidia
  #   command: roslaunch ros1_launcher reasoning_vlm.launch
  #   volumes:
  #     - *x11-volume
  #     - *robot-bringup-volume
  #     - ./workspaces/ws_vlm:/workspace


  # ==================== NMPC ====================

  # --- NMPC (colcon-built) ---
  # CBF stays disabled below - NMPC's own SDF-based collision constraint (quail.yaml flags.sdf_constraint)
  # is the only obstacle-avoidance layer in this configuration.
  ros2_launch_nmpc:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_nmpc
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - QT_X11_NO_MITSHM=1
      - PYTHONPATH=/workspace/src/sdf-nmpc:/home/developer/acados/interfaces/acados_template:${PYTHONPATH}
      - ACADOS_SOURCE_DIR=/home/developer/acados
      - LD_LIBRARY_PATH=/usr/local/lib:/home/developer/acados/lib:${LD_LIBRARY_PATH}
      - ROS_DOMAIN_ID=${DOMAIN_ID}
    command: bash -c "source /opt/ros/humble/setup.bash && source install/setup.bash && ros2 launch robot_bringup nmpc_full.launch.py cfg:=quail.yaml use_sim_time:=false odometry:=/msf_core/odometry_50hz input_image:=/img_node/range_image"
    volumes:
      - ./workspaces/ws_nmpc:/workspace
      - *robot-bringup-volume
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/dri:/dev/dri
    devices:
      - /dev/dri:/dev/dri


  # ==================== AUXILIARY SENSORS (not consumed by mimosa/gbplanner/NMPC) ====================

  # --- RealSense D455 (USB) ---
  # Started alongside the stack purely so its topics exist (rviz visualization, bag_rec.launch
  # recording of the /compressed siblings) - nothing else in this stack subscribes to it.
  # librealsense was built with -DFORCE_LIBUVC=true (see Dockerfile.ros2_realsense), so it talks to
  # the camera directly over libusb rather than a kernel v4l2 driver - needs raw /dev/bus/usb access,
  # hence privileged + full /dev mount (matches what was verified working via `rs-enumerate-devices`).
  #
  # user 1000:1000 (+ group_add root, for the root:root-owned /dev/bus/usb/* device node) matters
  # beyond just avoiding running as root: ros2_launch_ros1_bridge also runs as uid 1000, and FastDDS's
  # shared-memory transport creates /dev/shm segments owned by whatever uid published them, readable
  # only by that same uid. A root-owned publisher (the image's default, no USER set) is invisible over
  # SHM to the uid-1000 bridge - topics still show up in `ros2 topic info` (discovery is unaffected),
  # but zero messages ever arrive - so nothing looks obviously wrong short of checking message flow
  # directly. Confirmed via cross-container repro: identical failure with any root-owned publisher
  # talking to any uid-1000 subscriber, unrelated to realsense or CompressedImage specifically.
  ros2_launch_realsense:
    <<: *ros2-launch-template
    image: unified_autonomy:ros2_realsense
    privileged: true
    user: "1000:1000"
    group_add:
      - root
    environment:
      - ROS_DOMAIN_ID=${DOMAIN_ID}
      - HOME=/tmp
    command: bash -c "source /opt/ros/humble/setup.bash && source install/setup.bash && ros2 launch robot_bringup realsense_d455.launch.py"
    volumes:
      - ./workspaces/ws_realsense:/workspace
      - *robot-bringup-volume
      - /dev:/dev

